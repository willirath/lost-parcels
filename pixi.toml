[workspace]
authors = ["Willi Rath <wrath@geomar.de>"]
channels = ["conda-forge"]
name = "2025-11-09_oldparcels"
platforms = ["osx-64"]
version = "0.1.0"

[environments]
parcels-v09 = { features = ["parcels-v09"] }
parcels-v105 = { features = ["parcels-v105"] }
parcels-v111 = { features = ["parcels-v111"] }
parcels-v200 = { features = ["parcels-v200"] }
parcels-v215 = { features = ["parcels-v215"] }
parcels-v222 = { features = ["parcels-v222"] }
parcels-v232 = { features = ["parcels-v232"] }
parcels-v242 = { features = ["parcels-v242"] }
parcels-v306 = { features = ["parcels-v306"] }
parcels-v314 = { features = ["parcels-v314"] }
example-data = { features = ["example-data"] }

[feature.example-data.tasks.bootstrap-example-data]
cmd = 'env PARCELS_EXAMPLE_DATA="$PWD/.cache/parcels-example-data" python scripts/bootstrap-example-data.py'

[feature.example-data.dependencies]
python = "3.11.*"

[feature.parcels-v09.tasks.bootstrap-v09]
cmd = "bash scripts/bootstrap-parcels-v09.sh"

[feature.parcels-v09.tasks.parcels-v09-python]
cmd = 'python'

[feature.parcels-v09.tasks.parcels-v09-notebook]
cmd = 'jupyter notebook --notebook-dir=parcels-v09/examples --NotebookApp.open_browser=False'

[feature.parcels-v09.dependencies]
python = "2.7.*"
pip = ">=20.1.1,<21"
setuptools = "<45"
wheel = "<0.35"
cython = "<0.29"
numpy = "1.16.*"
scipy = "1.2.*"
netcdf4 = "1.5.*"
libnetcdf = ">=4.7.3,<5"
xarray = "0.11.*"
dask = "1.2.*"
pytest = "<5"
click = "7.*"
future = ">=0.18.2,<0.19"
enum34 = ">=1.1.10,<2"
notebook = "<6"
netcdftime = ">=1.0.0a2,<2"

[feature.parcels-v105.tasks.bootstrap-v105]
