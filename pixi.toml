[feature.parcels-v105.tasks.parcels-v105-notebook]
cmd = 'env MPLCONFIGDIR="$PWD/.cache/matplotlib" jupyter notebook --notebook-dir="$PWD/parcels-v105/parcels/examples" --NotebookApp.open_browser=False'

